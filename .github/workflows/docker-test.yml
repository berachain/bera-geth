name: Docker Build Test

on:
  pull_request:
    branches:
      - main
    paths:
      # Only run when relevant files change
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Dockerfile.alltools'
      - '.github/workflows/docker-test.yml'
      - 'internal/build/**'
      - 'cmd/geth/**'

jobs:
  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24
        cache: false

    # Test build without pushing - this will catch any build errors
    - name: Test Docker build using dockerx (no upload)
      run: |
        go run build/ci.go dockerx -platform linux/amd64,linux/arm64 -hub ghcr.io/berachain/bera-geth 
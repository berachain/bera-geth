name: CI

on:
  push:
    branches: [ main, "release/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        # The pre-built golangci-lint v2.0.2 is built with Go 1.24 and incompatible with Go 1.25 code
        # Build from source to ensure compatibility
        if [ ! -f build/cache/golangci-lint-go125-built ]; then
          echo "Building golangci-lint from source with Go 1.25..."
          rm -rf build/cache/golangci-lint-*
          mkdir -p build/cache/golangci-lint-2.0.2-linux-amd64
          GOBIN=$(pwd)/build/cache/golangci-lint-2.0.2-linux-amd64 go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.0.2
          touch build/cache/golangci-lint-go125-built
        fi
        
        # Now run linters with the Go 1.25-built binary
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache: false

      - name: Run tests
        run: go test -short ./...

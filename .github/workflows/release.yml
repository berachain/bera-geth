on:
  push:
    branches:
      - "main" 
      - "fix-ci" # TODO: remove fix-ci after testing.
    tags:
      - "v1.*"

jobs:
  # Note: Go 1.24 doesn't exist, but the -dlgo flag in build commands
  # downloads the correct Go version automatically from checksums.txt
  linux-intel:
    name: Linux Build (amd)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24
        cache: false

    - name: Install cross toolchain
      run: |
        sudo apt-get update
        sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

    - name: Build (amd64)
      run: |
        go run build/ci.go install -arch amd64 -dlgo

    - name: Create archive (amd64)
      run: |
        go run build/ci.go archive -arch amd64 -type tar
    - name: Upload artifacts (amd64)
      uses: actions/upload-artifact@v4
      with:
        name: linux-amd64-archives
        path: "*.tar.gz*"
    - name: Cleanup bin
      run: rm -f build/bin/*

    - name: Build (386)
      run: |
        go run build/ci.go install -arch 386 -dlgo

    - name: Create archive (386)
      run: |
        go run build/ci.go archive -arch 386 -type tar
    - name: Upload artifacts (386)
      uses: actions/upload-artifact@v4
      with:
        name: linux-386-archives
        path: "*.tar.gz*"
    - name: Cleanup bin
      run: rm -f build/bin/*

  linux-arm:
    name: Linux Build (arm)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24
        cache: false

    - name: Install cross toolchain
      run: |
        sudo apt-get update
        sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-arm-linux-gnueabi libc6-dev-armel-cross gcc-arm-linux-gnueabihf libc6-dev-armhf-cross gcc-aarch64-linux-gnu libc6-dev-arm64-cross
        sudo ln -s /usr/include/asm-generic /usr/include/asm

    - name: Build (arm64)
      run: |
        go run build/ci.go install -dlgo -arch arm64 -cc aarch64-linux-gnu-gcc

    - name: Create archive (arm64)
      run: |
        go run build/ci.go archive -arch arm64 -type tar
    - name: Upload artifacts (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-archives
        path: "*arm64*.tar.gz*"
    - name: Cleanup bin
      run: rm -fr build/bin/*

    - name: Run build (arm5)
      run: |
        go run build/ci.go install -dlgo -arch arm -cc arm-linux-gnueabi-gcc
      env:
        GOARM: "5"

    - name: Create archive (arm5)
      run: |
        go run build/ci.go archive -arch arm -type tar
      env:
        GOARM: "5"
    - name: Upload artifacts (arm5)
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm5-archives
        path: "*arm*5*.tar.gz*"
    - name: Cleanup bin
      run: rm -fr build/bin/*

    - name: Run build (arm6)
      run: |
        go run build/ci.go install -dlgo -arch arm -cc arm-linux-gnueabi-gcc
      env:
        GOARM: "6"

    - name: Create archive (arm6)
      run: |
        go run build/ci.go archive -arch arm -type tar
      env:
        GOARM: "6"
    - name: Upload artifacts (arm6)
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm6-archives
        path: "*arm*6*.tar.gz*"
    - name: Cleanup bin
      run: rm -fr build/bin/*

    - name: Run build (arm7)
      run: |
        go run build/ci.go install -dlgo -arch arm -cc arm-linux-gnueabi-gcc
      env:
        GOARM: "7"

    - name: Create archive (arm7)
      run: |
        go run build/ci.go archive -arch arm -type tar
      env:
        GOARM: "7"
    - name: Upload artifacts (arm7)
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm7-archives
        path: "*arm*7*.tar.gz*"
    - name: Cleanup bin
      run: rm -fr build/bin/*

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24
        cache: false

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push multi-arch images to GHCR
      run: |
        go run build/ci.go dockerx -platform linux/amd64,linux/arm64 -hub ghcr.io/berachain/bera-geth -upload

  release:
    name: Create Release
    needs: [linux-intel, linux-arm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
    
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Move all artifacts to current directory
        find ./artifacts -name "*.tar.gz*" -exec mv {} . \;
        
        # Create release
        tag_name="${GITHUB_REF#refs/tags/}"
        gh release create "$tag_name" \
          --title "Geth $tag_name" \
          --generate-notes \
          --draft \
          *.tar.gz*
